<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>角色动画帧 → 僵尸 效果预览（临时）</title>
<style>
  body { margin:0; background:#10131a; color:#dfe6f0; font-family:"Microsoft YaHei",monospace; }
  header { padding:16px 24px; border-bottom:1px solid #2a3244; }
  header h1 { font-size:20px; margin:0 0 4px; }
  header .sub { color:#9aa8bd; font-size:13px; }
  .controls { padding:12px 24px; border-bottom:1px solid #2a3244; display:flex; gap:20px; align-items:center; flex-wrap:wrap; }
  .controls label { font-size:13px; color:#9aa8bd; display:flex; align-items:center; gap:6px; }
  .controls input[type=range]{ width:140px; }
  .controls select{ background:#0e1118; color:#dfe6f0; border:1px solid #3a4660; padding:4px 8px; border-radius:6px; }
  main { padding:18px 24px; }
  .row { display:flex; gap:40px; flex-wrap:wrap; margin-bottom:24px; }
  .pair { display:flex; gap:8px; align-items:flex-end; }
  .pair figure { margin:0; text-align:center; }
  .pair canvas { image-rendering:pixelated; border:1px solid #2a3244; background:#0c0e14; }
  .pair figcaption { font-size:12px; color:#9aa8bd; margin-top:4px; }
  .vs { color:#ffd27f; font-size:16px; align-self:center; padding-bottom:30px; }
  .tile-title { font-size:15px; color:#7fd0ff; border-bottom:1px solid #2a3244; padding-bottom:6px; margin:18px 0 10px; }
  .legend { color:#9aa8bd; font-size:12px; margin-bottom:12px; }
  .note { color:#ff9a9a; font-size:12px; margin-top:8px; }
</style>
</head>
<body>
<header>
  <h1>角色动画帧 → 僵尸 · 效果实验</h1>
  <div class="sub">复用玩家行走/待机动画帧，但做「残损僵尸化」处理——不要和角色一模一样</div>
</header>

<div class="controls">
  <label>残损度 <span id="dmgV">35</span>% <input type="range" id="dmg" min="0" max="100" value="35"></label>
  <label>感染(尸字) <span id="infV">50</span>% <input type="range" id="inf" min="0" max="100" value="50"></label>
  <label>动画 <input type="checkbox" id="anim" checked></label>
  <label>方向
    <select id="dir">
      <option value="front">朝南</option>
      <option value="side">朝东</option>
      <option value="back">朝北</option>
    </select>
  </label>
</div>

<main>
  <div class="legend">左＝玩家原始帧 · 右＝僵尸化帧（残损+感染） · 上面行走循环 / 下面待机循环</div>

  <div class="tile-title">行走动画（4 帧循环）</div>
  <div class="row">
    <div class="pair">
      <figure><canvas id="walkP" width="180" height="180"></canvas><figcaption>玩家</figcaption></figure>
      <span class="vs">→</span>
      <figure><canvas id="walkZ" width="180" height="180"></canvas><figcaption>僵尸</figcaption></figure>
    </div>
  </div>

  <div class="tile-title">待机动画（4 帧循环）</div>
  <div class="row">
    <div class="pair">
      <figure><canvas id="idleP" width="180" height="180"></canvas><figcaption>玩家</figcaption></figure>
      <span class="vs">→</span>
      <figure><canvas id="idleZ" width="180" height="180"></canvas><figcaption>僵尸</figcaption></figure>
    </div>
  </div>

  <div class="tile-title">行走各帧对比（单帧）</div>
  <div class="row" id="frames"></div>

  <div class="note">※ 这是设计实验预览：把玩家的走路/待机帧直接接到僵尸上，但做了 ①肤色/衣物改腐色 ②身体打洞残损 ③高感染浮现"尸"字 ④驼背压低 的改造，让僵尸和角色明显不同。确认方案后固化进游戏。</div>
</main>

<script>
// ========== 工具 ==========
function hash2(seed,x,y){let h=(seed|0)^Math.imul(x|0,374761393)^Math.imul(y|0,668265263);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function px(o,label){const p=o.getContext('2d');p.imageSmoothingEnabled=false;return p;}

// 部位调色板（取自游戏 render.js MC_PAL）
const MC_PAL={
  skin:[[247,205,155],[200,160,120],[216,176,136],[117,75,50],[120,78,53]],
  hair:[[55,36,21],[74,46,22],[100,66,31],[56,40,24]],
  shirt:[[18,43,26],[20,45,24],[24,56,24],[40,80,40]],
  pants:[[28,48,66],[41,62,81],[48,64,88],[16,32,48]],
  shoes:[[109,66,32],[39,25,15],[120,67,25],[136,88,48],[72,43,22]],
  eyes:[[28,24,20],[50,35,25],[45,30,22]],
};
const MC_KEYS=Object.keys(MC_PAL);
function nearestPart(r,g,b){
  let best=null,bestD=1e9;
  for(const k of MC_KEYS)for(const p of MC_PAL[k]){const d=(p[0]-r)**2+(p[1]-g)**2+(p[2]-b)**2;if(d<bestD){bestD=d;best=k;}}
  return bestD<12000?best:null;
}
// 亮度缩放（保留明暗层次）
function shade(c,f){return [clamp(c[0]*f,0,255)|0,clamp(c[1]*f,0,255)|0,clamp(c[2]*f,0,255)|0];}

// 僵尸配色：每个部位 → 腐色基色 + 明暗变体
const ZOMBIE_COL={
  skin:[104,124,88],    // 腐绿
  hair:[42,38,34],      // 枯发
  shirt:[66,60,52],     // 脏衣
  pants:[52,54,58],     // 泥裤
  shoes:[38,32,32],     // 黑鞋
  eyes:[26,22,20],
};
// 每种部位给 3 档明暗（高光/中/阴影），配合原图明暗
function zombieColor(part, r,g,b, dmg){
  const base=ZOMBIE_COL[part]||[r,g,b];
  // 原图亮度（近似）
  const lum=(r*0.3+g*0.6+b*0.1);
  // 高亮部位更亮、暗部更暗
  const f=0.75+ (r+g+b)/765*0.5;
  // 残损：亮度更低、更脏
  const df=1-(dmg*0.5);
  const c=shade(base, f*df);
  // 腐斑：部分像素加入黄/绿脓点
  const n=hash2(1234^part.length, r&255, g&255);
  if(part==='skin'&&n>0.92){ return [n*255|0, 200, 60]; } // 脓斑
  if(part==='shirt'&&n>0.9){ return [90,40,40]; }          // 血渍
  return c;
}

// 裁剪到内容包围盒（去掉大片透明留白，让角色在预览里变大）
function cropContent(img){
  const w=img.width,h=img.height;
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const g=cv.getContext('2d');g.drawImage(img,0,0);
  const d=g.getImageData(0,0,w,h).data;
  let minX=w,minY=h,maxX=-1,maxY=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    if(d[(y*w+x)*4+3]>8){
      if(x<minX)minX=x;if(x>maxX)maxX=x;
      if(y<minY)minY=y;if(y>maxY)maxY=y;
    }
  }
  if(maxX<minX||maxY<minY)return img;
  const cw=maxX-minX+1, ch=maxY-minY+1;
  const out=document.createElement('canvas');out.width=cw;out.height=ch;
  out.getContext('2d').drawImage(img,minX,minY,cw,ch,0,0,cw,ch);
  return out;
}
// 通用腐化（不依赖部位分类的兜底）：所有可见像素去饱和 + 偏绿/偏灰 + 随机血斑/脓斑
function rotColor(r,gg,b,x,y,seed){
  // 去饱和
  const lum=clamp(0.3*r+0.6*gg+0.1*b,0,255);
  const desat=lum*0.55+0.45*((r+gg+b)/3);
  // 偏绿灰（腐）
  let nr=desat*0.9, ng=desat*1.08, nb=desat*0.86;
  const n=hash2(seed,x,y);
  if(n>0.94){ nr=70; ng=160; nb=50; }        // 脓绿斑
  else if(n>0.90){ nr=120; ng=55; nb=50; }   // 血斑
  else if(n>0.87){ nr=150; ng=150; nb=155; } // 苍白腐肉
  return [nr|0,ng|0,nb|0];
}
// 僵尸化一帧：img → 变换后 canvas（残损打洞 + 腐色 + 尸字 + 驼背压低）
function zombify(img0, dmg, inf){
  const img=cropContent(img0);
  const w=img.width,h=img.height;
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const g=cv.getContext('2d');g.imageSmoothingEnabled=false;
  g.drawImage(img,0,0);
  const d=g.getImageData(0,0,w,h);const dd=d.data;
  // 驼背：整体下半身固定，上半身（头/肩）向下压 hunch 像素 → 耸肩驼背感
  const hunch=Math.round(h*0.045);
  // 尸字像素集（在角色躯干位置）
  const textSet=makeTextSet('尸',w,h,2.6);
  const seed=999983;
  for(let y=0;y<h;y++){
    const ny=y/h;
    for(let x=0;x<w;x++){
      const i=(y*w+x)*4;
      if(dd[i+3]===0)continue;
      const r=dd[i],gg=dd[i+1],b=dd[i+2];
      const part=nearestPart(r,gg,b);
      // 残损打洞：躯干随机挖洞，边缘/中部更易烂
      const edge=Math.min(x/w,(w-x)/w,ny,(1-ny));
      const holeNoise=hash2(777^dmg, x,y);
      const holeChance=(dmg*0.55)*((1-edge)*0.7+0.3); // 越靠边缘越容易烂出缺口
      if(holeNoise<holeChance && part!=='eyes' && ny>0.18 && ny<0.9 && inf<0.95){
        dd[i+3]=0; continue;
      }
      let col;
      if(inf>0.4 && textSet.has(x*100+y) && ny>0.4){
        col=[150,115,128]; // 尸字
      } else if(part){
        col=zombieColor(part,r,gg,b,dmg);
      } else {
        col=rotColor(r,gg,b,x,y,seed); // 兜底：一律腐化
      }
      // 高残损：整体更暗更脏
      const dark=1-(dmg*0.18);
      dd[i]=col[0]*dark;dd[i+1]=col[1]*dark;dd[i+2]=col[2]*dark;
      // 边沿烂黑
      if(dmg>0 && edge<0.18){ const t=clamp((0.18-edge)*dmg*0.5,0,0.55); dd[i]*=(1-t);dd[i+1]*=(1-t);dd[i+2]*=(1-t); }
      // 驼背压低：躯干上部整体下移 hunch（把原图 drawImage 时已做——这里用另一方案：下移像素）
    }
  }
  g.putImageData(d,0,0);
  // 驼背：把上部 65% 的像素下移 hunch，形成耸肩驼背
  const c2=document.createElement('canvas');c2.width=w;c2.height=h;
  const g2=c2.getContext('2d');g2.imageSmoothingEnabled=false;
  g2.drawImage(cv,0,0,Math.round(w*0.9),Math.round(h*0.65),Math.round(w*0.05),hunch,Math.round(w*0.9),Math.round(h*0.65));
  // 保留腿部原样（不驼背的腿）
  g2.drawImage(cv,0,Math.round(h*0.65),w,Math.round(h*0.35),0,Math.round(h*0.65),w,Math.round(h*0.35));
  return c2;
}
function makeTextSet(char,w,h,fs){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d');g.font='bold '+Math.round(h/fs)+'px monospace';g.textAlign='center';g.textBaseline='middle';
  g.fillText(char,w*0.5,h*0.62);
  const d=g.getImageData(0,0,w,h).data,s=new Set();
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(d[(y*w+x)*4+3]>0)s.add(x*100+y);
  return s;
}

// ========== 加载帧 ==========
const BASE='mod-wasteland/sprites/';
const DIR_FRAMES={
  front:{walk:['walk-front-f0','walk-front-f1','walk-front-f2','walk-front-f3'],idle:['sprite-front-idle0','sprite-front-idle1','sprite-front-idle2','sprite-front-idle3']},
  side:{walk:['walk-side-f0','walk-side-f1','walk-side-f2','walk-side-f3'],idle:['sprite-side-idle0','sprite-side-idle1','sprite-side-idle2','sprite-side-idle3']},
  back:{walk:['walk-back-f0','walk-back-f1','walk-back-f2','walk-back-f3'],idle:['sprite-back-idle0','sprite-back-idle1','sprite-back-idle2','sprite-back-idle3']},
};
const cache={};
function load(dir,name){return new Promise(res=>{const key=dir+':'+name;if(cache[key])return res(cache[key]);const im=new Image();im.onload=()=>{cache[key]=im;res(im);};im.src=BASE+name+'.png';});}
let allLoaded=false;
Promise.all([...Object.keys(DIR_FRAMES)].flatMap(dir=>
  ['walk','idle'].flatMap(mode=>DIR_FRAMES[dir][mode].map(n=>load(dir,n)))
)).then(()=>{allLoaded=true;buildFrames();});

// ========== 渲染 ==========
const dmgEl=document.getElementById('dmg'),infEl=document.getElementById('inf');
const dmgV=document.getElementById('dmgV'),infV=document.getElementById('infV');
const dirEl=document.getElementById('dir'),animEl=document.getElementById('anim');
dmgEl.oninput=()=>{dmgV.textContent=dmgEl.value;drawAll();};
infEl.oninput=()=>{infV.textContent=infEl.value;drawAll();};
dirEl.onchange=drawAll;

function fitDraw(cv,src){
  const w=src.width,h=src.height;
  const scale=Math.min(cv.width/w, cv.height/h);
  const dw=w*scale, dh=h*scale;
  const c=cv.getContext('2d');
  c.imageSmoothingEnabled=false;
  c.fillStyle='#0c0e14';c.fillRect(0,0,cv.width,cv.height);
  c.drawImage(src,(cv.width-dw)/2,(cv.height-dh)/2,dw,dh);
}
let frameIdx=0;
function drawAll(){
  const dir=dirEl.value;
  const dmg=parseInt(dmgEl.value)/100, inf=parseInt(infEl.value)/100;
  const walkF=DIR_FRAMES[dir].walk, idleF=DIR_FRAMES[dir].idle;
  const wi=cache[dir+':'+walkF[frameIdx%4]];
  const ii=cache[dir+':'+idleF[frameIdx%4]];
  if(wi){fitDraw(document.getElementById('walkP'),wi); fitDraw(document.getElementById('walkZ'),zombify(wi,dmg,inf));}
  if(ii){fitDraw(document.getElementById('idleP'),ii); fitDraw(document.getElementById('idleZ'),zombify(ii,dmg,inf));}
  // 单帧对比
  const fs=document.getElementById('frames');fs.innerHTML='';
  walkF.forEach((n,i)=>{
    const src=cache[dir+':'+n];if(!src)return;
    const fig=document.createElement('figure');
    const c1=document.createElement('canvas');c1.width=110;c1.height=110;
    const c2=document.createElement('canvas');c2.width=110;c2.height=110;
    const p1=c1.getContext('2d'),p2=c2.getContext('2d');
    p1.imageSmoothingEnabled=false;p2.imageSmoothingEnabled=false;
    p1.drawImage(src,0,0,110,110);
    p2.drawImage(zombify(src,dmg,inf),0,0,110,110);
    const cap=document.createElement('div');cap.className='pair';cap.style.cssText='flex-direction:column';
    const f1=document.createElement('figure');f1.appendChild(c1);f1.insertAdjacentHTML('beforeend','<figcaption>帧'+(i+1)+' 玩家</figcaption>');
    const f2=document.createElement('figure');f2.appendChild(c2);f2.insertAdjacentHTML('beforeend','<figcaption>帧'+(i+1)+' 僵尸</figcaption>');
    const vs=document.createElement('span');vs.className='vs';vs.textContent='→';vs.style.cssText='padding:0;align-self:center';
    fig.style.cssText='display:flex;align-items:center;gap:8px;margin:0;';
    fig.appendChild(f1);fig.appendChild(vs);fig.appendChild(f2);
    fs.appendChild(fig);
  });
}
function buildFrames(){if(allLoaded)drawAll();}
setInterval(()=>{if(animEl.checked){frameIdx++;drawAll();}},180);
setTimeout(drawAll,200);
setTimeout(()=>{if(!allLoaded){drawAll();}},600);
</script>
</body>
</html>
